name: Integration KPI CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: ruff check --output-format github
      - name: Check typography
        run: |
          python - <<'PY'
          from subprocess import run

          result = run(["git", "grep", "-nI", chr(0x2014)], check=False)
          raise SystemExit(0 if result.returncode == 1 else 1)
          PY

  reports:
    name: Tests and dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - name: Test and measure coverage
        shell: bash
        run: |
          pytest -q --cov=kpi_lab --cov-report=term-missing --cov-report=json:coverage.json \
            --junitxml=pytest-results.xml | tee pytest-results.txt
      - name: Summarize test results
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          suites = ElementTree.parse("pytest-results.xml").getroot()
          tests = sum(int(suite.get("tests")) for suite in suites.findall("testsuite"))
          totals = json.loads(Path("coverage.json").read_text())["totals"]
          lines = f'{totals["covered_lines"]}/{totals["num_statements"]} statements'
          summary = f'{tests} tests passed. Line coverage {totals["percent_covered"]:.2f}% ({lines}).'
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as step_summary:
              step_summary.write(f"### Verification\n\n{summary}\n")
          PY
      - name: Check committed synthetic inputs
        run: |
          integration-kpi-sample --output generated-samples --seed 2829 --deliveries 6
          diff -ru samples generated-samples
      - name: Build sample reports with the CLI
        run: |
          integration-kpi import --junit-dir samples/junit --issues samples/issues.csv
          integration-kpi kpis --as-of 2025-04-11 > kpis.json
          integration-kpi readiness --as-of 2025-04-11 --gates config/gates.yml \
            --milestones samples/milestones.yml > readiness.json
          integration-kpi report --as-of 2025-04-11 --gates config/gates.yml \
            --milestones samples/milestones.yml --label 'Synthetic sample data' --out reports
      - name: Capture dashboard preview
        run: |
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars \
            --window-size=1440,1720 --screenshot=reports/dashboard-preview.png \
            "file://${PWD}/reports/dashboard.html"
          test -s reports/dashboard-preview.png
      - uses: actions/upload-artifact@v6
        with:
          name: dashboard
          path: |
            reports/
            kpis.json
            readiness.json
            pytest-results.txt
            pytest-results.xml
            coverage.json
          if-no-files-found: error
